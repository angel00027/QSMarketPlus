
#menu: normal para separa la logica
#de menu categoria y items , el pro para unir para esto es un resourcepack.
menu: normal
pro-menu:
  title: "<dark_gray>Shop » <yellow>%category% <gray>(%page%/%max_page%)"
  size: 54

bedrock:
  # Si los jugadores Bedrock (Geyser/Floodgate) usarán la gui de Formularios.
  # Ponlo en false para que usen el mismo menú que los jugadores Java.
  shop-gui: true

economies:
  # variables para el price-format , <symbol> <price> <currency>  es para el menu donde seleccionamos la cantidad de compra o venta.
  price-format: "<symbol> <price>"
  vault:
    display-name: "dinero"
    symbol: "$"

  xp:
    display-name: "Experiencia"
    symbol: "XP"

  levels:
    display-name: "Niveles"
    symbol: "Lv"

  points:
    display-name: "PlayerPoints"
    symbol: "P"


discord:
  webhook_enabled: false
  webhook_url: ''


auction:
  # Tiempo que dura una subasta antes de expirar (en segundos)
  # Ejemplos:
  # 60  = 1 minuto
  # 3600 = 1 hora
  # 86400 = 24 horas
  # 7 días = 7 × 24 × 3600 = 604800 segundos
  # 14 días = 14 × 24 × 3600 = 1209600 segundos
  # 30 × 24 × 3600 = 2592000 segundos
  expiration_seconds: 604800
  
  
  # Con qué frecuencia se revisan las subastas para ver si han expirado (en segundos)
  # Ejemplos:
  # 10 = cada 10 segundos (ideal para pruebas)
  # 300 = cada 5 minutos (recomendado en producción)
  expiration_check_interval: 10

auction-limits.default: 5 # Jugadores sin permisos especiales

# ======================================================
# 🤝 Sistema de Tradeo entre Jugadores
# ======================================================
trade:
  # Distancia máxima (en bloques) para iniciar o completar un tradeo.
  max-distance: 10

  # Tiempo (en segundos) que dura una solicitud de tradeo antes de expirar.
  request-timeout: 60

  # Tiempo (en segundos) que espera la cantidad escrita en el chat antes de descartarse.
  input-timeout: 45

  # Cuenta atrás (en segundos) cuando ambos jugadores están listos,
  # dando tiempo a cancelar para añadir algo más antes de completar.
  countdown-seconds: 5


database:
  type: sqlite # opciones: sqlite / mysql
  mysql:
    host: localhost
    port: 3306
    database: qsmarket
    user: root
    password: root
  sqlite:
    file: data.db





# ======================================================
# 📱 Configuración de Menús para Bedrock (Geyser/Floodgate)
# ======================================================
bedrock-menus:
  # Define si se deben remover de raíz los colores en Bedrock.
  # true = Texto plano y limpio (Evita errores visuales en versiones viejas de Bedrock)
  # false = Permite códigos minimessage nativos si Geyser los renderiza.
  strip-colors: true

  categories:
    title: "<gold><bold>«</bold> Tienda del Servidor <bold>»</bold></gold>"
    content: "<gray>Selecciona una categoría para explorar los artículos disponibles:</gray>"

  items:
    content: "<yellow>Elige un artículo para comprar o vender:</yellow>"
    back-button: "<red>« Volver a Categorías</red>"

  confirm:
    title: "<dark_aqua>Transacción:</dark_aqua> <green>%item%</green>"
    slider: "<gray>Cantidad a comerciar</gray>"
    label-header: "<yellow><bold>Detalles del Artículo:</bold></yellow>"
    label-balance: "<gray>Tu Saldo actual:</gray> <green>%balance%</green>"
    toggle-mode: "<gray>Modo:</gray> <red>COMPRA [Apagado]</red> <gray>/</gray> <green>VENTA [Encendido]</green>"
    toggle-back: "<dark_red>¿Volver a la lista de artículos?</dark_red> <gray>[Activar]</gray>"

holograms:
  enabled: true
  offset:
    x: 0.5
    y: 1.35
    z: 0.5
  rotation:
    enabled: true
    speed: 1.2
    interval: 1
  scale: 0.7
  view-range: 32


# ======================================================
# 🛒 Tiendas de Jugador (PlayerShops)
# ======================================================
player-shops:
  # Máxima distancia (en bloques) permitida entre el cartel
  # y el cofre al crear una tienda. 0 = sin límite.
  max-sign-distance: 10

  # Permitir crear una tienda sobre un cofre PROPIO protegido
  # por QsProteccion. Si es false, ningún cofre protegido
  # puede usarse como tienda (excepto admins/Bypass).
  allow-own-protected-chest: true

  # Requiere ser DUEÑO o MIEMBRO de la región de
  # ProtectionStones para poder crear una tienda
  # dentro de esa región.
  # Los tenats/inquilinos y externos NO podrán crear tiendas.
  require-region-permission: true

  # Permisos que ignoran los chequeos de QsProteccion.
  # Se configuran en un plugin de permisos (LuckPerms, etc.)
  bypass-protection-permission: qsmarket.shop.bypass.protection

  # ======================================================
  # Item requerido para permitir colocar tiendas
  # ======================================================
  # Si enabled es true, en vez de usar redstone para
  # vincular (click cofre → click cartel), el jugador
  # deberá sostener el item configurado.
  #
  # Esto sirve para gatear/limitar quién puede crear
  # tiendas con items especiales (ej: un token de tienda).
  #
  # NOTA: Este item SOLO se usa para crear/vinculár la
  # tienda. No se necesitará para comprar.
  require-item:
    enabled: false
    material: EMERALD
    # 0 = acepta cualquier custom model data
    custom-model-data: 0
    # Nombre exacto (con colores legacy §). Vacío = cualquiera
    display-name: ""
    # true = se consume 1 item al crear la tienda correctamente
    consume: true


