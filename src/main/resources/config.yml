
#menu: normal para separa la logica
#de menu categoria y items , el pro para unir para esto es un resourcepack.
menu: normal
pro-menu:
  title: "<dark_gray>Shop » <yellow>%category% <gray>(%page%/%max_page%)"
  size: 54

economies:
  # variables para el price-format , <symbol> <price> <currency>  es para el menu donde seleccionamos la cantidad de compra o venta.
  price-format: "<symbol> <price>"
  vault:
    display-name: "dinero"
    symbol: "$"

  xp:
    display-name: "Experiencia"
    symbol: "XP"

  levels:
    display-name: "Niveles"
    symbol: "Lv"

  points:
    display-name: "PlayerPoints"
    symbol: "P"


discord:
  webhook_enabled: false
  webhook_url: ''


auction:
  # Tiempo que dura una subasta antes de expirar (en segundos)
  # Ejemplos:
  # 60  = 1 minuto
  # 3600 = 1 hora
  # 86400 = 24 horas
  # 7 días = 7 × 24 × 3600 = 604800 segundos
  # 14 días = 14 × 24 × 3600 = 1209600 segundos
  # 30 × 24 × 3600 = 2592000 segundos
  expiration_seconds: 604800
  
  
  # Con qué frecuencia se revisan las subastas para ver si han expirado (en segundos)
  # Ejemplos:
  # 10 = cada 10 segundos (ideal para pruebas)
  # 300 = cada 5 minutos (recomendado en producción)
  expiration_check_interval: 10

auction-limits.default: 5 # Jugadores sin permisos especiales


database:
  type: sqlite # opciones: sqlite / mysql
  mysql:
    host: localhost
    port: 3306
    database: qsmarket
    user: root
    password: root
  sqlite:
    file: data.db





# ======================================================
# 📱 Configuración de Menús para Bedrock (Geyser/Floodgate)
# ======================================================
bedrock-menus:
  # Define si se deben remover de raíz los colores en Bedrock.
  # true = Texto plano y limpio (Evita errores visuales en versiones viejas de Bedrock)
  # false = Permite códigos minimessage nativos si Geyser los renderiza.
  strip-colors: true

  categories:
    title: "<gold><bold>«</bold> Tienda del Servidor <bold>»</bold></gold>"
    content: "<gray>Selecciona una categoría para explorar los artículos disponibles:</gray>"

  items:
    content: "<yellow>Elige un artículo para comprar o vender:</yellow>"
    back-button: "<red>« Volver a Categorías</red>"

  confirm:
    title: "<dark_aqua>Transacción:</dark_aqua> <green>%item%</green>"
    slider: "<gray>Cantidad a comerciar</gray>"
    label-header: "<yellow><bold>Detalles del Artículo:</bold></yellow>"
    label-balance: "<gray>Tu Saldo actual:</gray> <green>%balance%</green>"
    toggle-mode: "<gray>Modo:</gray> <red>COMPRA [Apagado]</red> <gray>/</gray> <green>VENTA [Encendido]</green>"
    toggle-back: "<dark_red>¿Volver a la lista de artículos?</dark_red> <gray>[Activar]</gray>"

holograms:
  enabled: true
  offset:
    x: 0.5
    y: 1.35
    z: 0.5
  rotation:
    enabled: true
    speed: 1.2
    interval: 1
  scale: 0.7
  view-range: 32


