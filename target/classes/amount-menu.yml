menu:
  title-buy: "<green>Selecciona cantidad a comprar"
  title-sell: "<red>Selecciona cantidad a vender"
  size: 54

# Lore del panel de confirmacion de objetos unicos (ConfirmMenu)
info-slot:
  lore-buy:
    - ""
    - "<color:#5aa0e6>Cantidad: </color><color:#cedb56><amount></color>"
    - "<gray>Total: <gold><price>"
    - ""
    - "<green>Comprando..."

  lore-sell:
    - ""
    - "<color:#5aa0e6>Cantidad: </color><color:#cedb56><amount></color>"
    - "<gray>Total: <gold><price>"
    - ""
    - "<red>Vendiendo..."

# Variables: <amount> <stacks> <price> <unit> <max> <max_stacks> <item>
panel:
  lore-buy:
    - ""
    - "<color:#5aa0e6>Cantidad: </color><color:#cedb56><amount></color> <dark_gray>(<stacks>)"
    - "<gray>Precio por unidad: <white><unit>"
    - "<gray>Total: <gold><price>"
    - ""
    - "<gray>Máximo posible: <white><max></white> <dark_gray>(<max_stacks>)"
    - "<dark_gray>Según tu espacio y tu dinero"
  lore-sell:
    - ""
    - "<color:#5aa0e6>Cantidad: </color><color:#cedb56><amount></color> <dark_gray>(<stacks>)"
    - "<gray>Precio por unidad: <white><unit>"
    - "<gray>Recibes: <gold><price>"
    - ""
    - "<gray>Tienes: <white><max></white> <dark_gray>(<max_stacks>)"
  confirm-lore:
    - "<gray><amount> <dark_gray>(<stacks>)"
    - "<gray>Total: <gold><price>"
  max-lore:
    - "<gray>Pone <white><max></white> <dark_gray>(<max_stacks>)"
  # Con un cupón activo se añaden estas líneas (variables <coupon> <percent> <saved> <original>)
  coupon-lore:
    - ""
    - "<green>Cupón: <white><coupon></white> (-<percent>%)"
    - "<gray>Antes: <strikethrough><original></strikethrough> <green>ahorras $<saved>"
  coupon-button:
    - "<gray>Tienes <white><count></white> cupón(es) para esta categoría"
    - "<gray>Clic: usar uno · Clic derecho: mis cupones"
  coupon-button-active:
    - "<green>Activo: <white><coupon>"
    - "<gray>Clic: cambiar · Clic derecho: mis cupones"
  blocked-no-space: "<red>Tu inventario está lleno"
  blocked-no-money: "<red>No te alcanza el dinero"
  blocked-no-items: "<red>No tienes este objeto"

# Slots que quedan vacios (las esquinas de la zona de botones)
layout:
  empty-slots: [36, 44, 45, 53]

# Vista de tu inventario en las 4 filas de arriba (la ultima fila es tu barra rapida)
preview:
  filling:
    - "<green>+<take> aquí"
    - "<gray>Quedará en <white><total>"
    - ""
    - "<yellow>Click: <gray>llenar hasta aquí"
  free-lore:
    - "<gray>Caben <white><room></white> aquí"
    - ""
    - "<yellow>Click: <gray>llenar hasta aquí"
  selling:
    - "<red>Vendes <take> de <have>"
    - ""
    - "<yellow>Click: <gray>vender hasta aquí"
  keeping-lore:
    - "<gray>Tienes <white><have></white> aquí"
    - ""
    - "<yellow>Click: <gray>vender hasta aquí"
  free-name: "<green>Libre"
  no-money-name: "<red>Sin dinero para más"
  keeping-name: "<aqua>Se queda contigo"

texts:
  write-prompt: "<yellow>Escribe la cantidad en el chat. <gray>Máximo: <white><max></white>. Escribe <white>max</white> o <white>cancelar</white>."
  write-invalid: "<red>Esa cantidad no es válida."
  write-capped: "<yellow>Solo puedes llegar a <white><max></white>."

