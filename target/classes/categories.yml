menu:
  # Título del menú principal de la tienda
  # Soporta MiniMessage (<green>, <bold>, colores hex, etc.)
  title: "<green>QSMarketPlus</green>"

  # Número de filas del inventario (1–6)
  rows: 6


buttons:
  close:
    # Slot donde aparecerá el botón (0–53)
    slot: 49

    # Material base del ítem
    # Puede ser cualquier Material de Minecraft
    material: "BARRIER"

    # Textura personalizada (PLAYER_HEAD)
    # Si se define, se ignora el material visualmente
    # Compatible con enlaces de minecraft-heads.com
    head: "http://textures.minecraft.net/texture/beb588b21a6f98ad1ff4e085c552dcb050efc9cab427f46048f18fc803475f7"

    # Nombre del ítem
    name: "<red>Cerrar</red>"

    # Lore del botón
    lore:
      - "<gray>Cierra el menú"


  sell-all:
    # Slot del botón vender todo
    slot: 51

    # Material base
    material: "GOLD_BLOCK"

    # Nombre visible
    name: "<yellow>Vender todo</yellow>"

    # Cabeza personalizada opcional
    head: "http://textures.minecraft.net/texture/9fd108383dfa5b02e86635609541520e4e158952d68c1c8f8f200ec7e88642d"

    # Descripción
    lore:
      - "<gray>Vende todos tus items"


